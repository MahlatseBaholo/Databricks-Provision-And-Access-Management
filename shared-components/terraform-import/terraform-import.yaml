trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
  resourcegroup: 'sasoleuw-big-data-aes-restore-rg'
  accountname: 'sasolaesiac'
  containername: 'terraform'
  key: 'adb-unity-catalog-sandbox.tfstate'
  accesskey: 'rL8c4EJ0WhHyKlMhr96th9swepgB56xB47O5Eo3XYLHzywn0bfpRqTjvKG8yY+vr0dpaf0HL3h6O+AStFcZE6w=='

stages:
  - stage: tfimport
    jobs:
      - job: tfimport
        steps:
        - task: TerraformInstaller@0
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTaskV4@4
          displayName: init
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'AES 2.0 Dev - SP'
            backendAzureRmResourceGroupName: '$(resourcegroup)'
            backendAzureRmStorageAccountName: '$(accountname)'
            backendAzureRmContainerName: '$(containername)'
            backendAzureRmKey: '$(key)'
            workingDirectory: '$(System.DefaultWorkingDirectory)/azure-terraform/databricks/terraform-import/'
        - script: |
            terraform import databricks_metastore.metastore 88ad67c1-2d9f-448a-a740-155002742426
          displayName: 'Import Resources'
          workingDirectory: '$(System.DefaultWorkingDirectory)/azure-terraform/databricks/terraform-import/'
