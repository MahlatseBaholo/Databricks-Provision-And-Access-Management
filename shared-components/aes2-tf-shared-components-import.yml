trigger:
- none

pool:
  name: Default

parameters:
  - name: env
    default: dev

variables:
  metastore_rg: 'sasoleuw-big-data-aes-unity-catalog-rg'
  tfstate_storage: 'sasoleuaes2terraform'
  containername: 'shared-components'
  key: 'metastore/terraform.tfstate'
  azureSubscription: 'AES 2.0 ${{ parameters.env }} - SP'
  keyVaultName: 'sasol-${{ parameters.env }}-aes-key'
  
stages:
  - stage: tfimport
    jobs:
      - job: tfimport
        steps:
          - powershell: |
              $ip = (Invoke-RestMethod -Uri "http://ifconfig.me/ip").Trim()
              Write-Host "##vso[task.setvariable variable=currentip]$ip"
            displayName: 'Set variable currentip'

          - powershell: |
              Write-Host "Current Build Agent IP is $(currentip)"
            displayName: 'Display variable currentip'

          - task: AzureCLI@2
            displayName: 'Add IP to Key Vault firewall'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                Write-Host "Adding IP $(currentip) to Key Vault"
                az keyvault network-rule add `
                  --name $(keyVaultName) `
                  --ip-address $(currentip)

          - task: AzureKeyVault@2
            displayName: 'get secrets from Azure Key Vault'
            inputs:
              azureSubscription: $(azureSubscription)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: 'AccessKey-sasoleuwaescatalog,SubscriptionID,TenantID,ServicePrincipal-DevOps-ClientID,ServicePrincipal-DevOps-ClientSecret,Metastore-ID,Metastore-Name,Databricks-Account-ServicePrincipal-ClientID,Databricks-Account-ServicePrincipal-ClientSecret,Databricks-Workspace-ID,Databricks-Workspace-Name,Databricks-Workspace-ServicePrincipal-ClientID,Databricks-Workspace-ServicePrincipal-ClientSecret,Databricks-Workspace-Host,Databricks-AccountID'
              RunAsPreJob: false

          - script: |
              echo "Setting environment variables for Terraform..."
              echo "##vso[task.setvariable variable=ARM_ACCESS_KEY;issecret=true]$(AccessKey-sasoleuwaescatalog)"
              echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID;issecret=true]$(SubscriptionID)"
              echo "##vso[task.setvariable variable=ARM_TENANT_ID;issecret=true]$(TenantID)"
              echo "##vso[task.setvariable variable=ARM_CLIENT_ID;issecret=true]$(ServicePrincipal-DevOps-ClientID)"
              echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$(ServicePrincipal-DevOps-ClientSecret)"
              echo "##vso[task.setvariable variable=DATABRICKS_ACCOUNT_CLIENT_ID;issecret=true]$(Databricks-Account-ServicePrincipal-ClientID)"
              echo "##vso[task.setvariable variable=METASTORE_ID;issecret=true]$(Metastore-ID)"
              echo "##vso[task.setvariable variable=METASTORE_NAME;issecret=true]$(Metastore-Name)"
              echo "##vso[task.setvariable variable=DATABRICKS_WORKSPACE_ID;issecret=true]$(Databricks-Workspace-ID)"
              echo "##vso[task.setvariable variable=DATABRICKS_WORKSPACE_NAME;issecret=true]$(Databricks-Workspace-Name)"
              echo "##vso[task.setvariable variable=DATABRICKS_ACCOUNT_CLIENT_SECRET;issecret=true]$(Databricks-Account-ServicePrincipal-ClientSecret)"
              echo "##vso[task.setvariable variable=DATABRICKS_WORKSPACE_CLIENT_ID;issecret=true]$(Databricks-Workspace-ServicePrincipal-ClientID)"
              echo "##vso[task.setvariable variable=DATABRICKS_WORKSPACE_CLIENT_SECRET;issecret=true]$(Databricks-Workspace-ServicePrincipal-ClientSecret)"
              echo "##vso[task.setvariable variable=DATABRICKS_WORKSPACE_HOST;issecret=true]$(Databricks-Workspace-Host)"
              echo "##vso[task.setvariable variable=DATABRICKS_ACCOUNT_ID;issecret=true]$(Databricks-AccountID)"  
            displayName: 'set Env Vars from Secrets'

          - task: AzureCLI@2
            displayName: 'Remove IP from Key Vault firewall'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                Write-Host "Removing IP $(currentip) from Key Vault"
                az keyvault network-rule remove --name $(keyVaultName) --ip-address $(currentip)

          - task: TerraformInstaller@0
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: init
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: '$(azureSubscription)'
              backendAzureRmResourceGroupName: '$(metastore_rg)'
              backendAzureRmStorageAccountName: '$(tfstate_storage)'
              backendAzureRmContainerName: '$(containername)'
              backendAzureRmKey: '$(key)'
              workingDirectory: '$(System.DefaultWorkingDirectory)/shared-components/'
          - script: |
              echo ARM_CLIENT_ID=$ARM_CLIENT_ID
              echo ARM_TENANT_ID=$ARM_TENANT_ID
          - script: |
              echo Using Service Principal authentication

              terraform import azurerm_resource_group.$(metastore_rg) /subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/$(metastore_rg)
            workingDirectory: '$(System.DefaultWorkingDirectory)/shared-components/'
            env:
              TF_VAR_subscription_id: $(ARM_SUBSCRIPTION_ID)
              TF_VAR_tenant_id: $(ARM_TENANT_ID)
              TF_VAR_client_id: $(ARM_CLIENT_ID)
              TF_VAR_client_secret: $(ARM_CLIENT_SECRET)
              TF_VAR_account_client_id: $(DATABRICKS_ACCOUNT_CLIENT_ID)
              TF_VAR_account_client_secret: $(DATABRICKS_ACCOUNT_CLIENT_SECRET)
              TF_VAR_workspace_client_id: $(DATABRICKS_WORKSPACE_CLIENT_ID)
              TF_VAR_workspace_client_secret: $(DATABRICKS_WORKSPACE_CLIENT_SECRET)
              TF_VAR_workspace_host: $(DATABRICKS_WORKSPACE_HOST)
              TF_VAR_account_id: $(DATABRICKS_ACCOUNT_ID)
              DATABRICKS_ACCOUNT_ID: $(DATABRICKS_ACCOUNT_ID)
              DATABRICKS_CLIENT_ID: $(DATABRICKS_ACCOUNT_CLIENT_ID)
              DATABRICKS_CLIENT_SECRET: $(DATABRICKS_ACCOUNT_CLIENT_SECRET)
              DATABRICKS_TENANT_ID: $(ARM_TENANT_ID)
          - script: |
              terraform import azurerm_resource_group.$(metastore_rg) /subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/$(metastore_rg)            
              terraform import azurerm_storage_account.$(tfstate_storage) /subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/$(metastore_rg)/providers/Microsoft.Storage/storageAccounts/$(tfstate_storage)
              terraform import azurerm_storage_account.sasoleuwaescatalog /subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/$(metastore_rg)/providers/Microsoft.Storage/storageAccounts/sasoleuwaescatalog
              terraform import azurerm_storage_container.metastore https://sasoleuwaescatalog.blob.core.windows.net/metastore
              terraform import azurerm_storage_container.shared-components https://sasoleuaes2terraform.blob.core.windows.net/shared-components
              terraform import azurerm_user_assigned_identity.sasoleuw-aes-catalog-id /subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/$(metastore_rg)/providers/Microsoft.ManagedIdentity/userAssignedIdentities/sasoleuw-aes-catalog-id
              terraform import azurerm_databricks_access_connector.sasoleuw-aes-catalog-conncetor /subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/$(metastore_rg)/providers/Microsoft.Databricks/accessConnectors/sasoleuw-aes-catalog-conncetor
            displayName: 'Import Resources'
            workingDirectory: '$(System.DefaultWorkingDirectory)/shared-components/'
            env:
              TF_VAR_subscription_id: $(ARM_SUBSCRIPTION_ID)
              TF_VAR_tenant_id: $(ARM_TENANT_ID)
              TF_VAR_client_id: $(ARM_CLIENT_ID)
              TF_VAR_client_secret: $(ARM_CLIENT_SECRET)
              TF_VAR_account_client_id: $(DATABRICKS_ACCOUNT_CLIENT_ID)
              TF_VAR_account_client_secret: $(DATABRICKS_ACCOUNT_CLIENT_SECRET)
              TF_VAR_workspace_client_id: $(DATABRICKS_WORKSPACE_CLIENT_ID)
              TF_VAR_workspace_client_secret: $(DATABRICKS_WORKSPACE_CLIENT_SECRET)
              TF_VAR_workspace_host: $(DATABRICKS_WORKSPACE_HOST)
              TF_VAR_account_id: $(DATABRICKS_ACCOUNT_ID)
              DATABRICKS_ACCOUNT_ID: $(DATABRICKS_ACCOUNT_ID)
              DATABRICKS_CLIENT_ID: $(DATABRICKS_ACCOUNT_CLIENT_ID)
              DATABRICKS_CLIENT_SECRET: $(DATABRICKS_ACCOUNT_CLIENT_SECRET)
              DATABRICKS_TENANT_ID: $(ARM_TENANT_ID)


