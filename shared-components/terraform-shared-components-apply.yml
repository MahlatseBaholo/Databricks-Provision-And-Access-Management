trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
  resourcegroup: 'sasoleuw-big-data-dev-aes-shared-components-rg'
  accountname: 'sasolshared-components'
  containername: 'shared-components'
  key: 'metastore/shared-components.tfstate'
  accesskey: 'BwPZlGrsD3EQn4B1ZrZxbPqK+51F+DuhQUYXUInfjtYgwtAx6mEzUNd+p+NZNWREiLsulbaJFBC2+ASth6AtRg=='

stages:
  - stage: tfapply
    jobs:
      - job: tfinstall
        steps:
          - task: shared-componentsInstaller@1
            displayName: install
            inputs:
              shared-componentsVersion: 'latest'
      - job: tfapply
        steps:
          - task: shared-componentsInstaller@1
            displayName: install
            inputs:
              shared-componentsVersion: 'latest'
          - task: shared-componentsTaskV4@4
            displayName: init 
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'AES 2.0 Dev - SP'
              backendAzureRmResourceGroupName: '$(resourcegroup)'
              backendAzureRmStorageAccountName: '$(accountname)'
              backendAzureRmContainerName: '$(containername)'
              backendAzureRmKey: '$(key)'
              workingDirectory: '$(System.DefaultWorkingDirectory)/shared-components'
          - task: shared-componentsTaskV4@4
            displayName: apply 
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'AES 2.0 Dev - SP'
              workingDirectory: '$(System.DefaultWorkingDirectory)/shared-components'