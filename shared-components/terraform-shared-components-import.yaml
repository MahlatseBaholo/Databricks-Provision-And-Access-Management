trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
  resourcegroup: 'sasolsan-simegas-dev-terraform-rg'
  accountname: 'sasoldevsimegasterraform'
  containername: 'shared-components'
  key: 'metastore_azure_southafricanorth/terraform.tfstate'
  azureSubscription: 'AES 2.0 Dev - SP'
  keyVaultName: 'sasol-dev-aes-key'

stages:
  - stage: tfimport
    jobs:
      - job: tfimport
        steps:
          - bash: |
              echo "##vso[task.setvariable variable=currentip]$(curl -s http://ifconfig.me/ip)"
            displayName: 'set variable currentip'

          - bash: echo "Current Build Agent IP is $(currentip)"
            displayName: 'display variable currentip'

          - task: AzureCLI@2
            displayName: 'add IP to Key Vault firewall'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Adding IP $(currentip) to Key Vault"
                az keyvault network-rule add -n $(keyVaultName) --ip-address $(currentip)

          - task: AzureKeyVault@2
            displayName: 'get secrets from Azure Key Vault'
            inputs:
              azureSubscription: $(azureSubscription)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: 'AccessKey-sasoldevsimegasterraform,SubscriptionID,TenantID,ServicePrincipal-DevOps-ClientID,ServicePrincipal-DevOps-ClientSecret,Databricks-Account-ServicePrincipal-ClientID,Databricks-Workspace-ServicePrincipal-ClientID,Databricks-Workspace-ServicePrincipal-ClientSecret,Databricks-Workspace-Host,Databricks-AccountID'
              RunAsPreJob: false

          - script: |
              echo "Setting environment variables for Terraform..."
              echo "##vso[task.setvariable variable=ARM_ACCESS_KEY;issecret=true]$(AccessKey-sasoldevsimegasterraform)"
              echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID;issecret=true]$(SubscriptionID)"
              echo "##vso[task.setvariable variable=ARM_TENANT_ID;issecret=true]$(TenantID)"
              echo "##vso[task.setvariable variable=ARM_CLIENT_ID;issecret=true]$(ServicePrincipal-DevOps-ClientID)"
              echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$(ServicePrincipal-DevOps-ClientSecret)"
              echo "##vso[task.setvariable variable=DATABRICKS_ACCOUNT_CLIENT_ID;issecret=true]$(Databricks-Account-ServicePrincipal-ClientID)"
              echo "##vso[task.setvariable variable=DATABRICKS_ACCOUNT_CLIENT_SECRET;issecret=true]$(Databricks-Account-ServicePrincipal-ClientSecret)"
              echo "##vso[task.setvariable variable=DATABRICKS_WORKSPACE_CLIENT_ID;issecret=true]$(Databricks-Workspace-ServicePrincipal-ClientID)"
              echo "##vso[task.setvariable variable=DATABRICKS_WORKSPACE_CLIENT_SECRET;issecret=true]$(Databricks-Workspace-ServicePrincipal-ClientSecret)"
              echo "##vso[task.setvariable variable=DATABRICKS_WORKSPACE_HOST;issecret=true]$(Databricks-Workspace-Host)"
              echo "##vso[task.setvariable variable=DATABRICKS_ACCOUNT_ID;issecret=true]$(Databricks-AccountID)"  
            displayName: 'set Env Vars from Secrets'

          - task: AzureCLI@2
            displayName: 'remove IP from Key Vault firewall'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Removing IP $(currentip) from Key Vault"
                az keyvault network-rule remove -n $(keyVaultName) --ip-address $(currentip)
        - task: TerraformInstaller@0
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTaskV4@4
          displayName: init
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'SIMEGAS Dev - SP'
            backendAzureRmResourceGroupName: '$(resourcegroup)'
            backendAzureRmStorageAccountName: '$(accountname)'
            backendAzureRmContainerName: '$(containername)'
            backendAzureRmKey: '$(key)'
            workingDirectory: '$(System.DefaultWorkingDirectory)/shared-components/'
        - script: |
            terraform import azurerm_resource_group.sasolsan-simegas-dev-rg /subscriptions/4a044c24-1775-4ff2-9395-2b5b39bfb09a/resourceGroups/sasolsan-simegas-dev-rg            
            terraform import azurerm_resource_group.sasolsan-simegas-dev-terraform-rg /subscriptions/4a044c24-1775-4ff2-9395-2b5b39bfb09a/resourceGroups/sasolsan-simegas-dev-terraform-rg
            terraform import azurerm_storage_account.sasolsansimegascatalog /subscriptions/4a044c24-1775-4ff2-9395-2b5b39bfb09a/resourceGroups/sasolsan-simegas-unity-catalog-rg/providers/Microsoft.Storage/storageAccounts/sasolsansimegascatalog
            terraform import azurerm_storage_container.metastore https://sasolsansimegascatalog.blob.core.windows.net/metastore
            terraform import databricks_metastore.metastore_azure_southafricanorth 5d82725a-eafd-46d2-9fae-2712b2c31d5f
            terraform import databricks_metastore_assignment.metastore_azure_southafricanorth '1584894596117397|5d82725a-eafd-46d2-9fae-2712b2c31d5f'
            terraform import azurerm_user_assigned_identity.sasolsan-simegas-catalog-id /subscriptions/4a044c24-1775-4ff2-9395-2b5b39bfb09a/resourceGroups/sasolsan-simegas-unity-catalog-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/sasolsan-simegas-catalog-id
            terraform import azurerm_databricks_access_connector.sasolsan-simegas-catalog-conncetor /subscriptions/4a044c24-1775-4ff2-9395-2b5b39bfb09a/resourceGroups/sasolsan-simegas-unity-catalog-rg/providers/Microsoft.Databricks/accessConnectors/sasolsan-simegas-catalog-conncetor
          displayName: 'Import Resources'
          workingDirectory: '$(System.DefaultWorkingDirectory)/shared-components/'
