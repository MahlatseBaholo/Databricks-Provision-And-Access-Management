trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
  resourcegroup: 'sasoleuw-simegas-dev-rg'
  accountname: 'sasoldevsimegasterraform'
  containername: 'shared-components'
  key: 'metastore/terraform.tfstate'

stages:
  - stage: tfimport
    jobs:
      - job: tfimport
        steps:
        - task: TerraformInstaller@0
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTaskV4@4
          displayName: init
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'SIMEGAS Dev - SP'
            backendAzureRmResourceGroupName: '$(resourcegroup)'
            backendAzureRmStorageAccountName: '$(accountname)'
            backendAzureRmContainerName: '$(containername)'
            backendAzureRmKey: '$(key)'
            workingDirectory: '$(System.DefaultWorkingDirectory)/shared-components/'
        - script: |
            terraform import azurerm_resource_group.sasoleuw-simegas-dev-rg /subscriptions/4a044c24-1775-4ff2-9395-2b5b39bfb09a/resourceGroups/sasoleuw-simegas-dev-rg            
            terraform import azurerm_storage_account.sasolzansimegascatalog /subscriptions/4a044c24-1775-4ff2-9395-2b5b39bfb09a/resourceGroups/sasolzan-simegas-unity-catalog-rg/providers/Microsoft.Storage/storageAccounts/sasolzansimegascatalog
            terraform import azurerm_storage_container.metastore https://sasolzansimegascatalog.blob.core.windows.net/metastore
            terraform import databricks_metastore.metastore 5d82725a-eafd-46d2-9fae-2712b2c31d5f
            terraform import databricks_metastore_assignment.metastore '3212216276919665|5d82725a-eafd-46d2-9fae-2712b2c31d5f'
            terraform import azurerm_user_assigned_identity.sasolzan-simegas-catalog-id /subscriptions/4a044c24-1775-4ff2-9395-2b5b39bfb09a/resourceGroups/sasolzan-simegas-unity-catalog-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/sasolzan-simegas-catalog-id
            terraform import azurerm_databricks_access_connector.sasolzan-simegas-catalog-conncetor /subscriptions/4a044c24-1775-4ff2-9395-2b5b39bfb09a/resourceGroups/sasolzan-simegas-unity-catalog-rg/providers/Microsoft.Databricks/accessConnectors/sasolzan-simegas-catalog-conncetor
          displayName: 'Import Resources'
          workingDirectory: '$(System.DefaultWorkingDirectory)/shared-components/'
