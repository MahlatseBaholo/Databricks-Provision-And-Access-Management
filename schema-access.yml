trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraform_version: '1.1.0'
  databricks_cli_version: '0.15.1'

jobs:
- job: GenerateYamlAndGrantPermissions
  displayName: 'Generate YAML and Grant Schema Permissions'
  steps:

  # Step 3: Install required Python dependencies
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
      addToPath: true

  - script: |
      python -m pip install --upgrade pip
      pip install pyyaml
    displayName: 'Install Python dependencies'

  # Step 4: Run Python script to generate access_config.yaml from terraform.tfvars
  - script: |
      python generate_yaml.py terraform.tfvars
    displayName: 'Generate access_config.yaml from terraform.tfvars'
