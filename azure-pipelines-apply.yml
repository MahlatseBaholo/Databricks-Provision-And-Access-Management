trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
  resourcegroup: 'sasoleuw-big-data-dev-aes-terraform-rg'
  accountname: 'sasolterraform'
  containername: 'sasol-sandbox-aes-dbw'
  key: 'unity-catalog/terraform.tfstate'
  accesskey: 'BwPZlGrsD3EQn4B1ZrZxbPqK+51F+DuhQUYXUInfjtYgwtAx6mEzUNd+p+NZNWREiLsulbaJFBC2+ASth6AtRg=='

stages:
  - stage: tfapply_catalogs
    displayName: "Apply Catalogs and Schemas"
    jobs:
      - job: apply_catalogs
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: Terraform Init (catalogs)
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'AES 2.0 Dev - SP'
              backendAzureRmResourceGroupName: '$(resourcegroup)'
              backendAzureRmStorageAccountName: '$(accountname)'
              backendAzureRmContainerName: '$(containername)'
              backendAzureRmKey: '$(key)'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/'
              #extraArguments: '-target=module.databricks_catalog_with_access -target=module.databricks_external_location -target=module.databricks_storage_credential -target=module.storage_container'

          - task: TerraformTaskV4@4
            displayName: Terraform Apply (catalogs)
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'AES 2.0 Dev - SP'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/'
              # Target only catalog-related resources in this stage
              #extraArguments: '-target=module.databricks_catalog_with_access -target=module.databricks_external_location -target=module.databricks_storage_credential -target=module.storage_container'
                retryCountOnTaskFailure: 3
            # Optional: Add a condition to rerun only on failure
            condition: failed()
  - stage: tfapply_schema_grants
    displayName: "Apply Schema Grants"
    dependsOn: tfapply_catalogs
    jobs:
      - job: apply_schema_grants
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: Terraform Init (grants)
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'AES 2.0 Dev - SP'
              backendAzureRmResourceGroupName: '$(resourcegroup)'
              backendAzureRmStorageAccountName: '$(accountname)'
              backendAzureRmContainerName: '$(containername)'
              backendAzureRmKey: '$(key)'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/module/databricks_catalog_schema_grants/'

          - task: TerraformTaskV4@4
            displayName: Terraform Apply (grants)
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'AES 2.0 Dev - SP'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/module/databricks_catalog_schema_grants/'