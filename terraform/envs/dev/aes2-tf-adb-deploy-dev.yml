trigger:
  branches:
    include:
    - main
pool:
  name: Default
parameters:
- name: env
  default: dev
variables:
- name: env
  value: dev
- name: terraform_rg
  value: sasoleuw-big-data-dev-aes-terraform-rg
- name: tfstate_storage
  value: sasoldevterraform
- name: containername
  value: sasol-dev-aes2-dbw
- name: key
  value: 'manage/terraform.tfstate'
- name: azureSubscription
  value: AES 2.0 dev - SP
- name: keyVaultName
  value: sasol-dev-aes-key
stages:
- stage: tfvalidate
  displayName: "Terraform Validate"
  jobs:
  - job: tfvalidate
    displayName: "Validate"
    steps:
    - checkout: self
      clean: true
    - task: TerraformInstaller@1
      displayName: install
      inputs:
        terraformVersion: '1.5.7'
    - task: TerraformTaskV4@4
      displayName: init
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: $(azureSubscription)
        backendAzureRmResourceGroupName: '$(terraform_rg)'
        backendAzureRmStorageAccountName: '$(tfstate_storage)'
        backendAzureRmContainerName: '$(containername)'
        backendAzureRmKey: '$(key)'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/envs/$(env)/'
    - task: TerraformTaskV4@4
      displayName: validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
- stage: tfplan
  displayName: "Terraform Plan"
  dependsOn:
  - tfvalidate
  condition: succeeded('tfvalidate')
  jobs:
  - job: tfplan
    displayName: "plan"
    steps:
    - checkout: self
      clean: true
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: |
          $ip = (Invoke-RestMethod -Uri "http://ifconfig.me/ip")
          Write-Host "##vso[task.setvariable variable=currentip]$ip"
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: |
          Write-Host "Current Build Agent IP is $(currentip)"
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          Write-Host "Adding IP $(currentip) to Key Vault"
          az keyvault network-rule add -n $(keyVaultName) --ip-address $(currentip)
    - task: AzureKeyVault@2
      displayName: 'get secrets from Azure Key Vault'
      inputs:
        azureSubscription: $(azureSubscription)
        KeyVaultName: $(keyVaultName)
        SecretsFilter: 'AccessKey-sasol$(env)terraform,SubscriptionID,TenantID,ServicePrincipal-DevOps-ClientID,ServicePrincipal-DevOps-ClientSecret,Metastore-ID,Metastore-Name,Databricks-Account-ServicePrincipal-ClientID,Databricks-Account-ServicePrincipal-ClientSecret,Databricks-Workspace2-ID,Databricks-Workspace-Name,Databricks-Workspace2-ServicePrincipal-ClientID,Databricks-Workspace2-ServicePrincipal-ClientSecret,Databricks-Workspace2-Host,Databricks-AccountID'
        RunAsPreJob: false
    - task: CmdLine@2
      displayName: 'set Env Vars from Secrets'
      inputs:
        script: "echo \"Setting environment variables for Terraform...\"\necho \"##vso[task.setvariable variable=ENV]$(env)\"\necho \"##vso[task.setvariable variable=ARM_ACCESS_KEY;issecret=true]$(AccessKey-sasol$(env)terraform)\"\necho \"##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID;issecret=true]$(SubscriptionID)\"\necho \"##vso[task.setvariable variable=ARM_TENANT_ID;issecret=true]$(TenantID)\"\necho \"##vso[task.setvariable variable=ARM_CLIENT_ID;issecret=true]$(ServicePrincipal-DevOps-ClientID)\"\necho \"##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$(ServicePrincipal-DevOps-ClientSecret)\"\necho \"##vso[task.setvariable variable=DATABRICKS_ACCOUNT_CLIENT_ID;issecret=true]$(Databricks-Account-ServicePrincipal-ClientID)\"\necho \"##vso[task.setvariable variable=DATABRICKS_ACCOUNT_CLIENT_SECRET;issecret=true]$(Databricks-Account-ServicePrincipal-ClientSecret)\"\necho \"##vso[task.setvariable variable=DATABRICKS_WORKSPACE_CLIENT_ID;issecret=true]$(Databricks-Workspace2-ServicePrincipal-ClientID)\"\necho \"##vso[task.setvariable variable=DATABRICKS_WORKSPACE_CLIENT_SECRET;issecret=true]$(Databricks-Workspace2-ServicePrincipal-ClientSecret)\"\necho \"##vso[task.setvariable variable=DATABRICKS_WORKSPACE_HOST;issecret=true]$(Databricks-Workspace2-Host)\"\necho \"##vso[task.setvariable variable=DATABRICKS_WORKSPACE_ID;issecret=true]$(Databricks-Workspace2-ID)\"\necho \"##vso[task.setvariable variable=DATABRICKS_ACCOUNT_ID;issecret=true]$(Databricks-AccountID)\"  \n"
  
    - powershell: |
        Write-Host "=== DEBUG TERRAFORM EXECUTION ==="

        $tfExe = "C:\agent\_work\_tool\terraform\1.14.8\x64\terraform.exe"

        Write-Host "1. Check file exists:"
        Test-Path $tfExe

        Write-Host "2. Get file details:"
        Get-Item $tfExe | Format-List *

        Write-Host "3. List directory:"
        Get-ChildItem "C:\agent\_work\_tool\terraform\1.14.8\x64"

        Write-Host "4. Check execution via call operator:"
        try {
            & $tfExe version
            Write-Host "Execution SUCCESS"
        } catch {
            Write-Host "Execution FAILED"
            Write-Host $_
        }

        Write-Host "5. Check PATH:"
        $env:PATH

        Write-Host "6. Where terraform:"
        where.exe terraform

        Write-Host "=== END DEBUG ==="
      displayName: "Deep Debug Terraform"

    - task: TerraformInstaller@1
      displayName: install
      inputs:
        terraformVersion: '1.5.7'

    - powershell: |
        cd "$(System.DefaultWorkingDirectory)/terraform/envs/$(env)"

        $tf = Get-ChildItem "C:\agent\_work\_tool\terraform" -Recurse -Filter terraform.exe | Select-Object -First 1

        if (-not $tf) {
          Write-Error "Terraform not found"
          exit 1
        }

        Write-Host "Using Terraform: $($tf.FullName)"

        & $tf.FullName init `
          -backend-config=storage_account_name=$(tfstate_storage) `
          -backend-config=container_name=$(containername) `
          -backend-config=key=$(key) `
          -backend-config=resource_group_name=$(terraform_rg)
      displayName: "Terraform Init"
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
  
    - task: TerraformTaskV4@4
      displayName: plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: $(azureSubscription)
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/envs/$(env)/'
      env:
        ARM_ACCESS_KEY: $(ARM_ACCESS_KEY)
        TF_VAR_env: $(ENV)
        TF_VAR_subscription_id: $(ARM_SUBSCRIPTION_ID)
        TF_VAR_tenant_id: $(ARM_TENANT_ID)
        TF_VAR_client_id: $(ARM_CLIENT_ID)
        TF_VAR_client_secret: $(ARM_CLIENT_SECRET)
        TF_VAR_account_client_id: $(DATABRICKS_ACCOUNT_CLIENT_ID)
        TF_VAR_account_client_secret: $(DATABRICKS_ACCOUNT_CLIENT_SECRET)
        TF_VAR_workspace_client_id: $(DATABRICKS_WORKSPACE_CLIENT_ID)
        TF_VAR_workspace_client_secret: $(DATABRICKS_WORKSPACE_CLIENT_SECRET)
        TF_VAR_workspace_host: $(DATABRICKS_WORKSPACE_HOST)
        TF_VAR_workspace_id: $(DATABRICKS_WORKSPACE_ID)
        TF_VAR_account_id: $(DATABRICKS_ACCOUNT_ID)
        DATABRICKS_ACCOUNT_ID: $(DATABRICKS_ACCOUNT_ID)
        DATABRICKS_CLIENT_ID: $(DATABRICKS_ACCOUNT_CLIENT_ID)
        DATABRICKS_CLIENT_SECRET: $(DATABRICKS_ACCOUNT_CLIENT_SECRET)
        DATABRICKS_TENANT_ID: $(ARM_TENANT_ID)
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          Write-Host "Adding IP $(currentip) to Key Vault"
          az keyvault network-rule remove -n $(keyVaultName) --ip-address $(currentip)
- stage: Approval
  displayName: "Approval"
  dependsOn:
  - tfplan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: ManualApproval
    displayName: "manual approval"
    environment:
      name: 'manual-approval-env'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: CmdLine@2
            inputs:
              script: echo "Waiting for manual approval"
- stage: tfapply
  displayName: "Terraform Apply"
  dependsOn:
  - Approval
  condition: succeeded('approval')
  jobs:
  - job: tfapply
    displayName: "apply"
    steps:
    - checkout: self
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: |
          $ip = (Invoke-RestMethod -Uri "http://ifconfig.me/ip")
          Write-Host "##vso[task.setvariable variable=currentip]$ip"
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: |
          Write-Host "Current Build Agent IP is $(currentip)"
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          Write-Host "Adding IP $(currentip) to Key Vault"
          az keyvault network-rule add -n $(keyVaultName) --ip-address $(currentip)
    - task: AzureKeyVault@2
      displayName: 'get secrets from Azure Key Vault'
      inputs:
        azureSubscription: $(azureSubscription)
        KeyVaultName: $(keyVaultName)
        SecretsFilter: 'AccessKey-sasol$(env)terraform,SubscriptionID,TenantID,ServicePrincipal-DevOps-ClientID,ServicePrincipal-DevOps-ClientSecret,Databricks-Account-ServicePrincipal-ClientID,Databricks-Workspace2-ServicePrincipal-ClientID,Databricks-Workspace2-ServicePrincipal-ClientSecret,Databricks-Workspace-Host,Databricks-AccountID'
        RunAsPreJob: false
    - task: CmdLine@2
      displayName: 'set Env Vars from Secrets'
      inputs:
        script: "echo \"Setting environment variables for Terraform...\"\necho \"##vso[task.setvariable variable=ENV]$(env)\"\necho \"##vso[task.setvariable variable=ARM_ACCESS_KEY;issecret=true]$(AccessKey-sasol$(env)terraform)\"\necho \"##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID;issecret=true]$(SubscriptionID)\"\necho \"##vso[task.setvariable variable=ARM_TENANT_ID;issecret=true]$(TenantID)\"\necho \"##vso[task.setvariable variable=ARM_CLIENT_ID;issecret=true]$(ServicePrincipal-DevOps-ClientID)\"\necho \"##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$(ServicePrincipal-DevOps-ClientSecret)\"\necho \"##vso[task.setvariable variable=DATABRICKS_ACCOUNT_CLIENT_ID;issecret=true]$(Databricks-Account-ServicePrincipal-ClientID)\"\necho \"##vso[task.setvariable variable=DATABRICKS_ACCOUNT_CLIENT_SECRET;issecret=true]$(Databricks-Account-ServicePrincipal-ClientSecret)\"\necho \"##vso[task.setvariable variable=DATABRICKS_WORKSPACE_CLIENT_ID;issecret=true]$(Databricks-Workspace2-ServicePrincipal-ClientID)\"\necho \"##vso[task.setvariable variable=DATABRICKS_WORKSPACE_CLIENT_SECRET;issecret=true]$(Databricks-Workspace2-ServicePrincipal-ClientSecret)\"\necho \"##vso[task.setvariable variable=DATABRICKS_WORKSPACE_HOST;issecret=true]$(Databricks-Workspace-Host)\"\necho \"##vso[task.setvariable variable=DATABRICKS_WORKSPACE_ID;issecret=true]$(Databricks-Workspace2-ID)\"\necho \"##vso[task.setvariable variable=DATABRICKS_ACCOUNT_ID;issecret=true]$(Databricks-AccountID)\"  \n"
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          Write-Host "Adding IP $(currentip) to Key Vault"
          az keyvault network-rule remove -n $(keyVaultName) --ip-address $(currentip)

    - task: TerraformTaskV4@4
      displayName: init
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: $(azureSubscription)
        backendAzureRmResourceGroupName: '$(terraform_rg)'
        backendAzureRmStorageAccountName: '$(tfstate_storage)'
        backendAzureRmContainerName: '$(containername)'
        backendAzureRmKey: '$(key)'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/envs/$(env)/'
    - task: TerraformTaskV4@4
      displayName: apply
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: $(azureSubscription)
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/envs/$(env)/'
      env:
        ARM_ACCESS_KEY: $(ARM_ACCESS_KEY)
        TF_VAR_env: $(ENV)
        TF_VAR_subscription_id: $(ARM_SUBSCRIPTION_ID)
        TF_VAR_tenant_id: $(ARM_TENANT_ID)
        TF_VAR_client_id: $(ARM_CLIENT_ID)
        TF_VAR_client_secret: $(ARM_CLIENT_SECRET)
        TF_VAR_account_client_id: $(DATABRICKS_ACCOUNT_CLIENT_ID)
        TF_VAR_account_client_secret: $(DATABRICKS_ACCOUNT_CLIENT_SECRET)
        TF_VAR_workspace_client_id: $(DATABRICKS_WORKSPACE_CLIENT_ID)
        TF_VAR_workspace_client_secret: $(DATABRICKS_WORKSPACE_CLIENT_SECRET)
        TF_VAR_workspace_host: $(DATABRICKS_WORKSPACE_HOST)
        TF_VAR_workspace_id: $(DATABRICKS_WORKSPACE_ID)
        TF_VAR_account_id: $(DATABRICKS_ACCOUNT_ID)
        DATABRICKS_ACCOUNT_ID: $(DATABRICKS_ACCOUNT_ID)
        DATABRICKS_CLIENT_ID: $(DATABRICKS_ACCOUNT_CLIENT_ID)
        DATABRICKS_CLIENT_SECRET: $(DATABRICKS_ACCOUNT_CLIENT_SECRET)
        DATABRICKS_TENANT_ID: $(ARM_TENANT_ID)
