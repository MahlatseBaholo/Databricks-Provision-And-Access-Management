
trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
  resourcegroup: 'sasoleuw-big-data-dev-aes-terraform-rg'
  accountname: 'sasoldevterraform'
  containername: 'sasol-sandbox-aes-dbw'
  key: 'catalog/terraform.tfstate'
  accesskey: 'sxk5ABUn3ft2pLSwj740BJNAMEPyAfB7PRlM7gwltYLVuMgVxJzDAZtJxK6uYygICwTNIBlo3dLt+AStgeNOTQ=='

stages:
  - stage: tfvalidate
    jobs:
      - job: tfvalidate
        steps:
          - bash: |
              echo "##vso[task.setvariable variable=currentip]$(curl -s http://ifconfig.me/ip)"
            displayName: 'Set variable currentip'
          - bash: |
              echo "Current Build Agent IP is $(currentip)"
            displayName: 'Display variable currentip'
          - task: AzureCLI@2
            displayName: 'Add IP to Key Vault firewall'
            inputs:
              azureSubscription: 'AES 2.0 Dev - SP'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Adding IP $(currentip) to Key Vault"
                az keyvault network-rule add -n 'sasol-dev-aes-key' --ip-address $(currentip)
          - task: AzureKeyVault@2
            displayName: 'Get secrets from Azure Key Vault'
            inputs:
              azureSubscription: 'AES 2.0 Dev - SP'
              KeyVaultName: 'sasol-dev-aes-key'
              SecretsFilter: 'Databricks-Host,Databricks-Token'
              RunAsPreJob: false
          - script: |
              echo "Setting environment variable for ARM_ACCESS_KEY"
              echo "##vso[task.setvariable variable=ARM_ACCESS_KEY]$(sasoldevterraform-access-key)"
            displayName: 'Set ARM Access Key Variable'
          - task: AzureCLI@2
            displayName: 'Remove IP from Key Vault firewall'
            inputs:
              azureSubscription: 'AES 2.0 Dev - SP'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Removing IP $(currentip) from Key Vault"
                az keyvault network-rule remove -n 'sasol-dev-aes-key' --ip-address $(currentip)
          - task: TerraformInstaller@1
            displayName: install
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTaskV4@4
            displayName: init
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'AES 2.0 Dev - SP'
              backendAzureRmResourceGroupName: '$(resourcegroup)'
              backendAzureRmStorageAccountName: '$(accountname)'
              backendAzureRmContainerName: '$(containername)'
              backendAzureRmKey: '$(key)'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/envs/dev/'
          - task: TerraformTaskV4@4
            displayName: validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
      - job: tfplan
        dependsOn: tfvalidate
        condition: succeeded('tfvalidate')
        steps:
          - task: TerraformInstaller@1
            displayName: install
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTaskV4@4
            displayName: init 
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'AES 2.0 Dev - SP'
              backendAzureRmResourceGroupName: '$(resourcegroup)'
              backendAzureRmStorageAccountName: '$(accountname)'
              backendAzureRmContainerName: '$(containername)'
              backendAzureRmKey: '$(key)'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/envs/dev/'

          - task: TerraformTaskV4@4
            displayName: plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'AES 2.0 Dev - SP'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/envs/dev/'