
trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
  resourcegroup: 'sasoleuw-big-data-dev-aes-terraform-rg'
  accountname: 'sasoldevterraform'
  containername: 'sasol-sandbox-aes-dbw'
  key: 'catalog/terraform.tfstate'
  azureSubscription: 'AES 2.0 Dev - SP'
  keyVaultName: 'sasol-dev-aes-key'

stages:
  - stage: tfvalidate
    jobs:
      - job: tfvalidate
        steps:
          - task: TerraformInstaller@1
            displayName: install
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTaskV4@4
            displayName: init
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: $(azureSubscription)
              backendAzureRmResourceGroupName: '$(resourcegroup)'
              backendAzureRmStorageAccountName: '$(accountname)'
              backendAzureRmContainerName: '$(containername)'
              backendAzureRmKey: '$(key)'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/envs/dev/'
          - task: TerraformTaskV4@4
            displayName: validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
      - job: tfplan
        dependsOn: tfvalidate
        condition: succeeded('tfvalidate')
        steps:
          - bash: |
              echo "##vso[task.setvariable variable=currentip]$(curl -s http://ifconfig.me/ip)"
            displayName: 'Set variable currentip'
          - bash: |
              echo "Current Build Agent IP is $(currentip)"
            displayName: 'Display variable currentip'
          - task: AzureCLI@2
            displayName: 'Add IP to Key Vault firewall'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Adding IP $(currentip) to Key Vault"
                az keyvault network-rule add -n $(keyVaultName) --ip-address $(currentip)
          - task: AzureKeyVault@2
            displayName: 'Get secrets from Azure Key Vault'
            inputs:
              azureSubscription: $(azureSubscription)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: 'AccessKey-sasoldevterraform,Databricks-Account-ServicePrincipal-ClientID,Databricks-Account-ServicePrincipal-ClientSecret,Databricks-Host-Account,Databricks-Workspace-ServicePrincipal-ClientID,Databricks-Workspace-ServicePrincipal-ClientSecret'
              RunAsPreJob: false
          - script: |
              echo "Setting environment variable"
              echo "##vso[task.setvariable variable=ARM_ACCESS_KEY]$(AccessKey-sasoldevterraform)"
              echo "##vso[task.setvariable variable=ARM_CLIENT_ID;issecret=true]$(terraform-client-id)"
              echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$(terraform-client-secret)"
              echo "##vso[task.setvariable variable=ARM_TENANT_ID;issecret=true]$(terraform-tenant-id)"
              echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID;issecret=true]$(terraform-subscription-id)"
            displayName: 'Set ARM Access Key Variable'
          - task: AzureCLI@2
            displayName: 'Remove IP from Key Vault firewall'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Removing IP $(currentip) from Key Vault"
                az keyvault network-rule remove -n $(keyVaultName) --ip-address $(currentip)
          - task: TerraformInstaller@1
            displayName: install
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTaskV4@4
            displayName: init 
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: $(azureSubscription)
              backendAzureRmResourceGroupName: '$(resourcegroup)'
              backendAzureRmStorageAccountName: '$(accountname)'
              backendAzureRmContainerName: '$(containername)'
              backendAzureRmKey: '$(key)'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/envs/dev/'

          - task: TerraformTaskV4@4
            displayName: plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: $(azureSubscription)
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/envs/dev/'