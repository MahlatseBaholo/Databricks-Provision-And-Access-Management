trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
  resourcegroup: 'sasoleuw-big-data-dev-aes-terraform-rg'
  accountname: 'sasolterraform'
  containername: 'shared-components'
  key: 'metastore/terraform.tfstate'
  accesskey: 'BwPZlGrsD3EQn4B1ZrZxbPqK+51F+DuhQUYXUInfjtYgwtAx6mEzUNd+p+NZNWREiLsulbaJFBC2+ASth6AtRg=='

stages:
  - stage: tfimport
    jobs:
      - job: tfimport
        steps:
        - task: TerraformInstaller@0
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTaskV4@4
          displayName: init
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'AES 2.0 Dev - SP'
            backendAzureRmResourceGroupName: '$(resourcegroup)'
            backendAzureRmStorageAccountName: '$(accountname)'
            backendAzureRmContainerName: '$(containername)'
            backendAzureRmKey: '$(key)'
            workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/'
        - script: |
            terraform import module.resource_group.azurerm_resource_group.sasoleuw-big-data-dev-aes-rg /subscriptions/53b5fe7d-2477-4a93-943a-af5571bf146c/resourceGroups/sasoleuw-big-data-dev-aes-rg
            terraform import module.resource_group.azurerm_resource_group.sasoleuw-big-data-aes-unity-catalog-rg /subscriptions/53b5fe7d-2477-4a93-943a-af5571bf146c/resourceGroups/sasoleuw-big-data-aes-unity-catalog-rg
          displayName: 'Import Resources'
          workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/'
